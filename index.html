<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitmesser – Mellingen</title>
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; background: #1a1a2e; color: #eaeaea; }
    h1 { font-weight: 300; letter-spacing: 0.05em; }
    .row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #333; }
    .label { color: #aaa; }
    .value { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>Zeitmesser</h1>
  <p style="color: #888;">Mellingen, CH · 47.42°N, 8.27°E</p>

  <!-- NEU: Die live Uhr -->
  <div style="text-align: center; margin: 1.5rem 0;">
    <div id="liveClock" style="font-size: 3rem; font-weight: 300; font-variant-numeric: tabular-nums;">--:--:--</div>
    <div id="liveDate" style="color: #aaa; font-size: 1.1rem; margin-top: 0.3rem;">Lade Datum...</div>
  </div>

  <!-- NEU: Der GPS Button -->
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <button id="gpsBtn" style="background: #333; color: #fff; border: 1px solid #555; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer;">
      📍 Aktuellen Standort verwenden
    </button>
  </div>

  <div class="row"><span class="label">Sonnenaufgang</span><span class="value" id="sunrise">–</span></div>
  <div class="row"><span class="label">Sonnenhöchststand</span><span class="value" id="solarNoon">–</span></div>
  <div class="row"><span class="label">Sonnenuntergang</span><span class="value" id="sunset">–</span></div>
  <div class="row"><span class="label">Tageslänge</span><span class="value" id="dayLength">–</span></div>
  <div class="row"><span class="label">Mondphase</span><span class="value" id="moonPhase">–</span></div>

  <script>
    // Variablen für den Standort
    let lat = 47.42, lng = 8.27;
    let locationName = "Mellingen, CH";

    // Funktion zur Berechnung der Himmelsdaten
    function calculateAndDisplay() {
      const now = new Date();
      const times = SunCalc.getTimes(now, lat, lng);
      const moonIllum = SunCalc.getMoonIllumination(now);

      // Ortsnamen im HTML aktualisieren
      document.querySelector('p[style*="color: #888"]').textContent = `${locationName} · ${lat.toFixed(2)}°N, ${lng.toFixed(2)}°E`;

      function formatTime(date) {
        if (!date || isNaN(date)) return '–';
        return date.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Zurich' });
      }

      document.getElementById('sunrise').textContent = formatTime(times.sunrise);
      document.getElementById('solarNoon').textContent = formatTime(times.solarNoon);
      document.getElementById('sunset').textContent = formatTime(times.sunset);

      if (times.sunrise && times.sunset) {
        const diffMs = times.sunset - times.sunrise;
        const hours = Math.floor(diffMs / 3600000);
        const minutes = Math.floor((diffMs % 3600000) / 60000);
        document.getElementById('dayLength').textContent = `${hours}h ${minutes}min`;
      }

      const phasePercent = Math.round(moonIllum.fraction * 100);
      document.getElementById('moonPhase').textContent = `${phasePercent}% beleuchtet`;
    }

    // Die Berechnung einmal beim Laden der Seite starten
    calculateAndDisplay();

    // --- Live Uhr und Datum ---
    function updateClock() {
      const now = new Date();
      
      const timeString = now.toLocaleTimeString('de-CH', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit',
        timeZone: 'Europe/Zurich' 
      });
      
      const dateString = now.toLocaleDateString('de-CH', { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        timeZone: 'Europe/Zurich'
      });

      document.getElementById('liveClock').textContent = timeString;
      document.getElementById('liveDate').textContent = dateString;
    }

    updateClock();
    setInterval(updateClock, 1000);

    // --- GPS-Standort abfragen ---
    document.getElementById('gpsBtn').addEventListener('click', () => {
      if (navigator.geolocation) {
        document.getElementById('gpsBtn').textContent = "📍 Suche Standort...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            lat = position.coords.latitude;
            lng = position.coords.longitude;
            locationName = "Aktueller Standort";
            document.getElementById('gpsBtn').textContent = "📍 Standort aktualisiert!";
            calculateAndDisplay();
          },
          (error) => {
            document.getElementById('gpsBtn').textContent = "📍 Standort verweigert";
            console.error("GPS Fehler:", error);
          }
        );
      } else {
        alert("Dein Browser unterstützt kein GPS.");
      }
    });
  </script>
</body>
</html>
