<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitmesser – Die-Zeit</title>
  
  <!-- Bibliotheken -->
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; background: #1a1a2e; color: #eaeaea; }
    h1 { font-weight: 300; letter-spacing: 0.05em; }
    .row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #333; }
    .label { color: #aaa; }
    .value { font-variant-numeric: tabular-nums; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Zeitmesser</h1>
  <p id="locationDisplay" style="color: #888;">Mellingen, CH · 47.42°N, 8.27°E</p>

  <div style="text-align: center; margin: 1.5rem 0;">
    <div id="liveClock" style="font-size: 3rem; font-weight: 300; font-variant-numeric: tabular-nums;">--:--:--</div>
    <div id="liveDate" style="color: #aaa; font-size: 1.1rem; margin-top: 0.3rem;">Lade Datum...</div>
  </div>

  <div style="text-align: center; margin-bottom: 1.5rem;">
    <button id="gpsBtn" style="background: #333; color: #fff; border: 1px solid #555; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer;">📍 Aktuellen Standort verwenden</button>
  </div>

  <!-- Ebenen-Menü -->
  <div style="background: #1f1f35; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; border: 1px solid #333;">
    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
      <input type="checkbox" id="tcmToggle" checked style="accent-color: #ffaa00;"> <span>TCM</span>
    </label>
    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
      <input type="checkbox" id="moonToggle" checked style="accent-color: #ccc;"> <span>Mond</span>
    </label>
    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
      <input type="checkbox" id="siderealToggle" checked style="accent-color: #ffaa00;"> <span>Sternzeit</span>
    </label>
    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
      <input type="checkbox" id="farmerToggle" checked style="accent-color: #4caf50;"> <span>Bauernkalender</span>
    </label>
    <label style="cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
      <input type="checkbox" id="planetToggle" checked style="accent-color: #00bcd4;"> <span>Planeten</span>
    </label>
  </div>

  <!-- TCM -->
  <div id="tcmBox" style="background: #252540; padding: 1rem; border-radius: 8px; text-align: center; margin-bottom: 1.5rem; border-left: 4px solid #ffaa00;">
    <div style="color: #aaa; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Aktuelle TCM-Organzeit</div>
    <div id="tcmOrgan" style="font-size: 1.5rem; font-weight: bold; color: #ffaa00; margin-top: 0.3rem;">Berechne...</div>
  </div>

  <!-- Sonne & Mond -->
  <div class="row"><span class="label">Sonnenaufgang</span><span class="value" id="sunrise">–</span></div>
  <div class="row"><span class="label">Sonnenhöchststand</span><span class="value" id="solarNoon">–</span></div>
  <div class="row"><span class="label">Sonnenuntergang</span><span class="value" id="sunset">–</span></div>
  <div class="row"><span class="label">Tageslänge</span><span class="value" id="dayLength">–</span></div>
  
  <div id="moonData">
    <div class="row"><span class="label">Mondphase</span><span class="value" id="moonPhase">–</span></div>
    <div class="row"><span class="label">Mondaufgang</span><span class="value" id="moonrise">–</span></div>
    <div class="row"><span class="label">Monduntergang</span><span class="value" id="moonset">–</span></div>
  </div>

  <div id="siderealData">
    <div class="row"><span class="label">Lokale Sternzeit</span><span class="value" id="siderealTime">–</span></div>
  </div>

  <div id="farmerData">
    <div class="row"><span class="label">Mondpflanzentag</span><span class="value" id="farmerDay" style="color: #4caf50; font-weight: bold;">–</span></div>
  </div>

  <div id="planetData">
    <div class="row"><span class="label">Jupiter</span><span class="value" id="planetJupiter">–</span></div>
    <div class="row"><span class="label">Saturn</span><span class="value" id="planetSaturn">–</span></div>
    <div class="row"><span class="label">Mars</span><span class="value" id="planetMars">–</span></div>
    <div class="row"><span class="label">Venus</span><span class="value" id="planetVenus">–</span></div>
  </div>

  <script>
    let lat = 47.42, lng = 8.27;
    let locationName = "Mellingen, CH";

    // 1. Statische Berechnungen (Sonne & Mond)
    function calculateAndDisplay() {
      const now = new Date();
      const times = SunCalc.getTimes(now, lat, lng);
      const moonIllum = SunCalc.getMoonIllumination(now);
      const moonTimes = SunCalc.getMoonTimes(now, lat, lng);

      document.getElementById('locationDisplay').textContent = `${locationName} · ${lat.toFixed(2)}°N, ${lng.toFixed(2)}°E`;

      function formatTime(date) {
        if (!date || isNaN(date)) return '–';
        return date.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Zurich' });
      }

      document.getElementById('sunrise').textContent = formatTime(times.sunrise);
      document.getElementById('solarNoon').textContent = formatTime(times.solarNoon);
      document.getElementById('sunset').textContent = formatTime(times.sunset);

      if (times.sunrise && times.sunset) {
        const diffMs = times.sunset - times.sunrise;
        const hours = Math.floor(diffMs / 3600000);
        const minutes = Math.floor((diffMs % 3600000) / 60000);
        document.getElementById('dayLength').textContent = `${hours}h ${minutes}min`;
      }

      const phasePercent = Math.round(moonIllum.fraction * 100);
      document.getElementById('moonPhase').textContent = `${phasePercent}% beleuchtet`;
      document.getElementById('moonrise').textContent = formatTime(moonTimes.rise);
      document.getElementById('moonset').textContent = formatTime(moonTimes.set);
    }

    // 2. Die tickende Uhr & dynamischen Daten
    function updateClock() {
      const now = new Date();
      
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Zurich' });
      document.getElementById('liveDate').textContent = now.toLocaleDateString('de-CH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Europe/Zurich' });

      // TCM
      const currentHour = parseInt(now.toLocaleTimeString('de-CH', { hour: '2-digit', hour12: false, timeZone: 'Europe/Zurich' }));
      const organs = [
        { start: 23, name: "Gallenblase (GB)" }, { start: 1, name: "Leber (LE)" }, { start: 3, name: "Lunge (LU)" }, { start: 5, name: "Dickdarm (DI)" },
        { start: 7, name: "Magen (MA)" }, { start: 9, name: "Milz (MP)" }, { start: 11, name: "Herz (HE)" }, { start: 13, name: "Dünndarm (DÜ)" },
        { start: 15, name: "Blase (BL)" }, { start: 17, name: "Niere (NI)" }, { start: 19, name: "Perikard (PE)" }, { start: 21, name: "Sanjiao (3E)" }
      ];
      let currentOrgan = "Unbekannt";
      for (let i = 0; i < organs.length; i++) {
        let current = organs[i];
        let next = organs[(i + 1) % organs.length];
        if (current.start < next.start) {
          if (currentHour >= current.start && currentHour < next.start) { currentOrgan = current.name; break; }
        } else {
          if (currentHour >= current.start || currentHour < next.start) { currentOrgan = current.name; break; }
        }
      }
      document.getElementById('tcmOrgan').textContent = currentOrgan;

      // Sternzeit
      const jd = (now.getTime() / 86400000) + 2440587.5;
      const d = jd - 2451545.0;
      let gmst = 280.46061837 + 360.98564736629 * d;
      gmst = gmst % 360; if (gmst < 0) gmst += 360;
      let lst = gmst + lng; lst = lst % 360; if (lst < 0) lst += 360;
      const totalSeconds = (lst / 15) * 3600;
      const h = Math.floor(totalSeconds / 3600); const m = Math.floor((totalSeconds % 3600) / 60); const s = Math.floor(totalSeconds % 60);
      document.getElementById('siderealTime').textContent = `${h.toString().padStart(2, '0')}h ${m.toString().padStart(2, '0')}m ${s.toString().padStart(2, '0')}s`;

      // Bauernkalender
      const T = jd; const d2 = T - 2451545.0;
      let moonLon = 218.32 + 13.176396 * d2 + 6.29 * Math.sin((134.9 + 13.064993 * d2) * Math.PI / 180);
      moonLon = moonLon % 360; if (moonLon < 0) moonLon += 360;
      const zodiacIndex = Math.floor(moonLon / 30);
      const plantDays = ["Wurzeltag (Feuer)", "Wurzeltag (Erde)", "Blütentag (Luft)", "Blattag (Wasser)", "Fruchttag (Feuer)", "Wurzeltag (Erde)", "Blütentag (Luft)", "Blattag (Wasser)", "Fruchttag (Feuer)", "Wurzeltag (Erde)", "Blütentag (Luft)", "Blattag (Wasser)"];
      document.getElementById('farmerDay').textContent = plantDays[zodiacIndex];

            // Planeten (Astronomy Engine)
      if (typeof Astronomy !== 'undefined') {
        const signs = ["Widder", "Stier", "Zwillinge", "Krebs", "Löwe", "Jungfrau", "Waage", "Skorpion", "Schütze", "Steinbock", "Wassermann", "Fische"];
        const planetMap = {
          'planetJupiter': Astronomy.Body.Jupiter,
          'planetSaturn': Astronomy.Body.Saturn,
          'planetMars': Astronomy.Body.Mars,
          'planetVenus': Astronomy.Body.Venus
        };
        
        for (const [elementId, planet] of Object.entries(planetMap)) {
          try {
            // Wir übergeben ein spezielles Datumsobjekt für die aktuelle Zeit
            const time = new Astronomy.AstroTime(now);
            // Berechnung der Position (Äquatorial)
            const eq = Astronomy.Equator(planet, time, new Astronomy.Observer(lat, lng, 0), true, true);
            // Umrechnung in ekliptikale Länge (Tierkreis)
            const ecl = Astronomy.Ecliptic(eq.ra, eq.dec);
            const signIndex = Math.floor(ecl.elon / 30);
            // Anzeige aktualisieren
            document.getElementById(elementId).textContent = signs[signIndex];
          } catch (e) {
            // Falls ein Fehler auftritt, loggen wir ihn in die Konsole, stürzen aber nicht ab
            console.warn("Planeten-Berechnungsfehler für " + planet + ":", e);
          }
        }
      }
      }
    } // <-- HIER ENDET DIE FUNKTION. DAS IST JETZT SAUBER.

    // Start
    calculateAndDisplay();
    updateClock();
    setInterval(updateClock, 1000);

    // GPS
    document.getElementById('gpsBtn').addEventListener('click', () => {
      if (navigator.geolocation) {
        document.getElementById('gpsBtn').textContent = "📍 Suche Standort...";
        navigator.geolocation.getCurrentPosition((position) => {
            lat = position.coords.latitude; lng = position.coords.longitude;
            locationName = "Aktueller Standort";
            document.getElementById('gpsBtn').textContent = "📍 Standort aktualisiert!";
            calculateAndDisplay(); updateClock();
          }, (error) => {
            document.getElementById('gpsBtn').textContent = "📍 Standort verweigert";
          });
      }
    });

    // Schalter
    ['tcm', 'moon', 'sidereal', 'farmer', 'planet'].forEach(type => {
      document.getElementById(type + 'Toggle').addEventListener('change', (event) => {
        const box = document.getElementById(type === 'tcm' ? 'tcmBox' : type + 'Data');
        if (box) box.style.display = event.target.checked ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
